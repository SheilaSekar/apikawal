services:
  - type: web
    name: apikawal
    plan: free
    region: singapore
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: APIKAWAL
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: APP_LOCALE
        value: id
      - key: APP_FALLBACK_LOCALE
        value: id
      - key: APP_FAKER_LOCALE
        value: id_ID
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SEED_DEMO
        value: "false"
      - key: SEED_ON_BOOT
        value: "false"
      - key: TRUSTED_PROXIES
        sync: false
